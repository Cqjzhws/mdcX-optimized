name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build & Archive
        id: build
        run: |
          cd mdcX
          SCHEME="mdcX"

          xcodebuild \
            -project mdcX.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/mdcX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            ENABLE_SANDBOX=NO \
            ONLY_ACTIVE_ARCH=NO \
            CLEAN_BUILD_FOLDER=YES \
            archive 2>&1 | tee build.log

          if ! grep -q "ARCHIVE SUCCEEDED" build.log; then
            echo "Archive FAILED"
            tail -100 build.log
            exit 1
          fi

          echo "Archive OK. Packing IPA manually..."

          # Manually create IPA from xcarchive (Payload/<App>.app structure)
          APP_PATH=$(find build/mdcX.xcarchive/Products/Applications -name "*.app" -maxdepth 1 -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app found in archive"
            ls -la build/mdcX.xcarchive/Products/Applications/ || echo "No Applications dir"
            exit 1
          fi

          echo "Found app: $APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/
          cd build/ipa
          IPA_NAME="mdcX_Max_v2.2.0_optimized.ipa"
          zip -r "$IPA_NAME" Payload -x "*.DS_Store"
          ls -la "$IPA_NAME"
          IPA_PATH="$(pwd)/$IPA_NAME"
          cd ../..

          echo "IPA=$IPA_PATH" >> $GITHUB_OUTPUT
          echo "Generated unsigned IPA: $IPA_PATH"

      - name: Upload artifact
        if: steps.build.outputs.IPA != ''
        uses: actions/upload-artifact@v4
        with:
          name: mdcX-Max-2.2.0-optimized
          path: ${{ steps.build.outputs.IPA }}
          retention-days: 30

      - name: Create GitHub Release
        if: steps.build.outputs.IPA != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.2.0-optimized
          name: "mdcX Max v2.2.0 (Performance Optimized)"
          body: |
            ## mdcX Max v2.2.0 - 性能优化构建

            ✨ **优化亮点**：
            - **全速动画**：按钮/过渡动画从 0.15~0.3s 降至 **0.08s**
            - **高级 UI**：continuous 圆角、渐变高光、动态阴影
            - **深色主题**：全界面深色模式
            - **终端风格日志**：黑色等宽字体控制台
            - **分类彩色图标**：per-category 渐变图标徽章
            - **新高级图标**：魔法棒 + 星尘渐变
            - **性能优化**：隐藏列表背景、stack navigation
            
            ⚠️ 未签名 IPA，需 AltStore / Sideloadly / TrollStore 安装
          files: ${{ steps.build.outputs.IPA }}
