name: Publish Release from Artifacts

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id whose artifacts should be published"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: mdcX-Max-2.3.3-IPA
          path: artifacts/ipa
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download dylib artifact
        uses: actions/download-artifact@v4
        with:
          name: mdcXCore-2.3.3-dylib
          path: artifacts/dylib
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bundle artifact
        uses: actions/download-artifact@v4
        with:
          name: mdcX-Max-2.3.3-bundle
          path: artifacts/bundle
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect
        run: |
          find artifacts -type f -print0 | xargs -0 ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.3.3-max
          name: "mdcX Max v2.3.3 (Root/Resolution Fix)"
          files: |
            artifacts/ipa/*.ipa
            artifacts/dylib/*.dylib
            artifacts/bundle/*.zip
          body: |
            ## mdcX Max v2.3.3 — 修复分辨率/注销不可用

            ### 关键修复
            - **注入 TrollStore 特权 entitlements**（no-sandbox / platform-application）：
              2.3.0 的未签名构建缺少特权，App 经 TrollStore 安装后仍被沙盒限制，
              无法写系统偏好域、注销无效。本版本从根本上修复。
            - **注销改为 root killall SpringBoard**（标准 Respring，温和可靠）
            - **Root 授权状态真实检测**：检查 killall 的 setuid-root 标记，
              工具箱可准确区分 TrollStore 安装与普通侧载
            - 分辨率 plist 在未修改过的设备上不存在时自动创建（原逻辑直接报错）
            - 当前画布在系统默认状态下正确显示「系统默认（未自定义）」

            ### 安装要求
            - 必须使用 **TrollStore** 安装；AltStore / Sideloadly / 证书侧载无法授权 root
            - 文件清零：iOS 14.0–16.1.2
            - 分辨率 / 注销：所有 TrollStore 可安装版本（含 iOS 16.2）
